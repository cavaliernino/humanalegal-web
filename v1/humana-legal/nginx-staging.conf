# =============================================================================
# Nginx config — Staging + Umami
# Ubicación: /etc/nginx/sites-available/staging-humanalegal.cl
# =============================================================================

# -----------------------------------------------------------------------------
# STAGING: subdominio privado para probar el sitio antes de la jura
# Ejemplos de dominios a usar (elegir uno):
#   - staging.tudominio.cl  (si tenés otro dominio personal disponible)
#   - preview.humanalegal.cl
#   - tlg.tudominio.cl
# Protegido con Basic Auth Y con noindex global — Google nunca lo verá.
# -----------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name staging.tudominio.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.tudominio.cl;

    root /var/www/staging-humanalegal.cl;
    index index.html;

    # SSL (certbot)
    ssl_certificate /etc/letsencrypt/live/staging.tudominio.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.tudominio.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;

    # ---- Basic Auth ----
    # Crear archivo con:
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd-staging tamara
    auth_basic "Sitio en pre-estreno — acceso restringido";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;

    # ---- NOINDEX global ----
    # Forzamos noindex a nivel header para que ningún buscador lo guarde
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # Security headers básicos (menos estrictos que producción, pero suficientes)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs
    access_log /var/log/nginx/staging.access.log;
    error_log  /var/log/nginx/staging.error.log warn;

    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    error_page 404 /404.html;
}

# -----------------------------------------------------------------------------
# UMAMI: reverse proxy al contenedor Docker de Umami
# Corriendo en 127.0.0.1:3001 (ver docker-compose.umami.yml)
# -----------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name umami.tudominio.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name umami.tudominio.cl;

    ssl_certificate /etc/letsencrypt/live/umami.tudominio.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/umami.tudominio.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Noindex — el panel de analytics no debe aparecer en Google
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/umami.access.log;
    error_log  /var/log/nginx/umami.error.log warn;

    # Subir el límite para el tracking script y payloads de eventos
    client_max_body_size 2M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90;
    }
}
