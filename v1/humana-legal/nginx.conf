# =============================================================================
# Nginx config — humanalegal.cl
# Ubicación: /etc/nginx/sites-available/humanalegal.cl
# Enlazar:   ln -s /etc/nginx/sites-available/humanalegal.cl /etc/nginx/sites-enabled/
# =============================================================================

# --- Definir en /etc/nginx/nginx.conf dentro de http{} ---
# limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/m;
# limit_conn_zone $binary_remote_addr zone=addr:10m;

# =============================================================================
# HTTP → HTTPS redirect (todos los dominios)
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name humanalegal.cl www.humanalegal.cl
                tamaralopez.cl www.tamaralopez.cl
                tamaralopezabogada.cl www.tamaralopezabogada.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.humanalegal.cl$request_uri;
    }
}

# =============================================================================
# Dominios secundarios → redirect permanente al principal
# tamaralopez.cl y tamaralopezabogada.cl (apex y www) → www.humanalegal.cl
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tamaralopez.cl www.tamaralopez.cl
                tamaralopezabogada.cl www.tamaralopezabogada.cl;

    ssl_certificate /etc/letsencrypt/live/humanalegal.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/humanalegal.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.humanalegal.cl$request_uri;
}

# =============================================================================
# humanalegal.cl apex → www (canonical)
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name humanalegal.cl;

    ssl_certificate /etc/letsencrypt/live/humanalegal.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/humanalegal.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.humanalegal.cl$request_uri;
}

# =============================================================================
# Main HTTPS server — www.humanalegal.cl
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.humanalegal.cl;

    root /var/www/humanalegal.cl;
    index index.html;

    # ---- SSL ----
    ssl_certificate /etc/letsencrypt/live/humanalegal.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/humanalegal.cl/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/humanalegal.cl/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-XSS-Protection "0" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # CSP — Formspree (formulario) + Umami self-hosted (analytics)
    # Reemplazar 'umami.tudominio.cl' por el subdominio real de Umami
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://umami.tudominio.cl; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://umami.tudominio.cl; connect-src 'self' https://formspree.io https://umami.tudominio.cl; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://formspree.io;" always;

    server_tokens off;

    # ---- Rate limiting ----
    limit_req zone=general burst=20 nodelay;
    limit_conn addr 20;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # ---- Logging ----
    access_log /var/log/nginx/humanalegal.access.log;
    error_log  /var/log/nginx/humanalegal.error.log warn;

    # ---- File size & timeouts ----
    client_max_body_size 2M;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # ---- Block common exploits ----
    location ~* \.(env|git|htaccess|htpasswd|ini|log|sh|sql|swp|bak|old)$ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # ---- Static asset caching ----
    location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|woff2?|ttf|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- Sitemap & robots ----
    location = /sitemap.xml {
        add_header Content-Type "application/xml; charset=utf-8";
        try_files $uri =404;
    }
    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        try_files $uri =404;
    }

    # ---- Contact form ----
    # El formulario envía directamente a Formspree (ver main.js).
    # Esta ubicación queda preparada por si en el futuro se migra a backend propio.
    # location = /api/contact {
    #     limit_req zone=contact burst=3 nodelay;
    #     proxy_pass http://contact_backend;
    # }

    # ---- Clean URLs ----
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    location /en/ {
        try_files $uri $uri/ /en/index.html =404;
    }

    # ---- Error pages ----
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { internal; }
}
