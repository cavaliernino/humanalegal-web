<!-- @dsCard group="Componentes" name="Formulario de contacto" subtitle="Hoja crema, inputs de línea inferior" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="only light">
<title>Formulario — Humana Legal</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Manrope:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{--bone:#f4efe6;--cream:#fdf9f0;--ink:#161310;--ink-soft:#5f5a53;--clay:#7a2f2f;--clay-deep:#5f1f1f;--hairline:rgba(22,19,16,.16);--sans:"Manrope",system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:#ece5d6;color:var(--ink);line-height:1.6;padding:2.5rem;display:grid;place-items:start center}
.form{width:min(560px,100%);background:var(--cream);border:1px solid var(--hairline);border-radius:2px;padding:2.4rem 2.2rem;box-shadow:0 6px 26px rgba(22,19,16,.05)}
label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:1.35rem 0 .3rem}
label:first-child{margin-top:0}
input,select,textarea{width:100%;font:inherit;font-size:.98rem;color:var(--ink);background:transparent;border:none;border-bottom:1px solid var(--ink);border-radius:0;padding:.5rem .1rem;outline:none;transition:border-color .3s var(--ease)}
input:focus,select:focus,textarea:focus{border-bottom-color:var(--clay)}
textarea{min-height:96px;resize:vertical}
.btn{margin-top:1.9rem;display:inline-block;padding:.95rem 1.9rem;font-weight:600;font-size:.95rem;border-radius:2px;border:none;cursor:pointer;background:var(--clay);color:var(--cream);font-family:inherit;transition:background .3s var(--ease)}
.btn:hover{background:var(--clay-deep)}
</style>
</head>
<body>
<form class="form" onsubmit="return false">
  <label for="f-nombre">Nombre completo</label><input id="f-nombre" name="nombre" type="text">
  <label for="f-correo">Correo electrónico</label><input id="f-correo" name="correo" type="email">
  <label for="f-area">Área de interés</label><select id="f-area" name="area"><option>Seleccione un área</option></select>
  <label for="f-caso">Cuéntenos brevemente su caso</label><textarea id="f-caso" name="caso"></textarea>
  <button class="btn" type="submit">Enviar mensaje</button>
</form>
</body>
</html>
