# /etc/nginx/sites-available/000-default
#
# Catch-all para hosts SIN vhost propio. Antes, el primer vhost alfabético
# (bozzialvarez) actuaba como default y servía su contenido a cualquier dominio
# sin configurar; por eso Google asoció humanalegal.cl con Bozzi durante la
# ventana previa al deploy. Este bloque rechaza los hosts desconocidos.
#
# Requiere nginx >= 1.19.4 (servidor: 1.26.3) para ssl_reject_handshake, que
# permite un default :443 sin certificado.
#
# No afecta a los dominios reales: todos tienen server_name explícito y nginx
# los matchea antes que a este default.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Permitir validaciones ACME por webroot (por si algún cert futuro las usa)
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 444; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
