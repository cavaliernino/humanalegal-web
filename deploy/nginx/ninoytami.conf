# ===== :443 — REDIRECT ninoytami → humanalegal (FASE 1) =====
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ninoytami.cl www.ninoytami.cl;

    ssl_certificate /etc/letsencrypt/live/ninoytami.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ninoytami.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.humanalegal.cl$request_uri;
}

# ===== :80 — todos los dominios de este vhost → HTTPS =====
server {
    listen 80;
    listen [::]:80;
    server_name ninoytami.cl www.ninoytami.cl tamaralopez.cl www.tamaralopez.cl;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
