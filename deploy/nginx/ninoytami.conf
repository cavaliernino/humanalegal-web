# /etc/nginx/sites-available/ninoytami  (REEMPLAZA el actual)
#
# Reescritura del vhost que hoy sirve ninoytami.cl + tamaralopez.cl (ambos
# mostrando la v1 desde /var/www/ninoytami.cl) para separarlos:
#
#   FASE 1 (ahora):
#     - ninoytami.cl  → 301 a www.humanalegal.cl
#     - tamaralopez.cl → sigue sirviendo la v1 (sin cambios visibles)
#
#   FASE 2 (día 19): comentar el bloque "SERVIR tamaralopez (v1)" y descomentar
#     el bloque "REDIRECT tamaralopez", luego: sudo nginx -t && sudo systemctl reload nginx
#
# El certificado ninoytami.cl (ya existente) cubre ninoytami.cl, www.ninoytami.cl,
# tamaralopez.cl y www.tamaralopez.cl, así que estos bloques lo reutilizan.

# ===== :443 — SERVIR tamaralopez (v1) =====  [FASE 2: comentar este bloque entero]
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tamaralopez.cl www.tamaralopez.cl;

    root /var/www/ninoytami.cl;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/ninoytami.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ninoytami.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/ninoytami.access.log;
    error_log  /var/log/nginx/ninoytami.error.log warn;

    gzip on; gzip_vary on; gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    location ~* \.(env|git|htaccess|htpasswd|ini|log|sh|sql|swp|bak|old)$ { deny all; return 404; }
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|woff2?|ttf|ico)$ {
        expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404;
    }
    location = /sitemap.xml { try_files $uri =404; }
    location = /robots.txt  { try_files $uri =404; }
    location / { try_files $uri $uri/ $uri.html /index.html =404; }
    location /en/ { try_files $uri $uri/ /en/index.html =404; }
    error_page 404 /404.html;
}

# ===== :443 — REDIRECT tamaralopez =====  [FASE 2: descomentar este bloque]
