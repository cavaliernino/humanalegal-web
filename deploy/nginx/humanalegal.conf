# /etc/nginx/sites-available/humanalegal
# Sitio nuevo Humana Legal (Astro estático en /var/www/humanalegal.cl).
#
# Se instala SOLO con bloque :80; luego certbot agrega el :443 y el redirect:
#   sudo certbot --nginx -d humanalegal.cl -d www.humanalegal.cl
# certbot conserva las directivas de este bloque al copiarlo a :443.
#
# Zonas limit_req 'general' y 'addr' ya están definidas en nginx.conf (las usa
# el vhost ninoytami). La zona 'contact' (para /api/contact) se agrega en la
# Fase 3, junto con el backend del formulario.

server {
    listen 80;
    listen [::]:80;
    server_name www.humanalegal.cl humanalegal.cl;

    root /var/www/humanalegal.cl;
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/humanalegal.access.log;
    error_log  /var/log/nginx/humanalegal.error.log warn;

    limit_req zone=general burst=20 nodelay;
    limit_conn addr 20;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: el sitio solo carga Google Fonts (CSS + woff2) y su propio JS/CSS.
    # El formulario hace POST same-origin a /api/contact.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    location ~* \.(env|git|htaccess|htpasswd|ini|log|sh|sql|swp|bak|old)$ { deny all; return 404; }
    location ~ /\.(?!well-known) { deny all; return 404; }

    location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|woff2?|ttf|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sitemap.xml { try_files $uri =404; }
    location = /robots.txt  { try_files $uri =404; }

    # ---- Formulario de contacto (ACTIVAR EN FASE 3, con el contact-api en :8085) ----
    # location = /api/contact {
    #     limit_req zone=contact burst=3 nodelay;
    #     client_max_body_size 64k;
    #     proxy_pass http://127.0.0.1:8085;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header Host $host;
    # }

    # Clean URLs del build de Astro (404 real, no soft-404)
    location / { try_files $uri $uri/ $uri.html =404; }
    location /en/ { try_files $uri $uri/ /en/index.html =404; }

    error_page 404 /404.html;
}
